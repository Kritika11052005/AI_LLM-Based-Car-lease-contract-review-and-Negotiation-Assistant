services:
  - type: web
    name: AI-car-lease-backend
    runtime: python
    rootDir: backend
    buildCommand: >
      pip install --upgrade pip &&
      pip install fastapi uvicorn python-dotenv prisma PyPDF2 Pillow pytesseract requests python-multipart httpx pydantic==1.10.13 &&
      pip install google-generativeai==0.3.2 &&
      pip install langchain==0.1.16 langchain-core==0.1.52 langchain-community==0.0.32 langchain-google-genai==0.0.9 langchain-text-splitters==0.0.1 &&
      pip install "chromadb==0.4.15" "protobuf<5.0.0" faiss-cpu==1.7.4 &&
      python -m prisma generate &&
      python -m prisma py fetch &&
      ENGINE_PATH=$(find /opt/render/.cache/prisma-python/binaries -type f -name "prisma-query-engine-*") &&
      cp "$ENGINE_PATH" . &&
      chmod +x prisma-query-engine-* &&
      python -m prisma db push
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9